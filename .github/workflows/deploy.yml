name: Deploy to Production

on:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Run inside a Debian 11 container to match the server environment (and fix GLIBC issues)
    container: node:24-bullseye

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No need for setup-node, we are inside node:24 container

      - name: Install dependencies
        run: npm ci

      # - name: Run Tests
      #   run: npm test

      - name: Build Application
        run: |
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          # Passenger starts server.js: our logging wrapper, which then loads Next's own server.
          mv .next/standalone/server.js .next/standalone/next-server.js
          cp deploy/server.js .next/standalone/server.js

      - name: Prepare server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            T="${{ secrets.SSH_TARGET_DIR }}"
            T="${T%/}"
            # If an earlier deploy stopped between the two renames, put the last release back first.
            if [ ! -f "$T/server.js" ] && [ -f "$T.prev/server.js" ]; then
              rm -rf "$T"
              mv "$T.prev" "$T"
              mkdir -p "$T/tmp"
              touch "$T/tmp/restart.txt"
              echo "Restored the previous release"
            fi
            mkdir -p "$T"

      - name: Deploy via SCP (Password)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: '.next/standalone/*'
          # Upload next to the live app first; the step below swaps it in. Deleting the live
          # directory before uploading took the site down for the length of the upload.
          target: ${{ secrets.SSH_TARGET_DIR }}/../vsgraph-release
          strip_components: 2
          rm: true

      - name: Post-Deployment Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            T="${{ secrets.SSH_TARGET_DIR }}"
            T="${T%/}"
            NEW="$(dirname "$T")/vsgraph-release"
            test -f "$NEW/server.js" && test -f "$NEW/next-server.js"
            mkdir -p "$NEW/tmp"
            rm -rf "$T.prev"
            mv "$T" "$T.prev"
            mv "$NEW" "$T"
            touch "$T/tmp/restart.txt"
            echo "Deployed; the previous release is in $T.prev"
